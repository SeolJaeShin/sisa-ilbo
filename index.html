<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#192f38"><title>시사일보 | 오늘의 뉴스</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><style>
:root{--bg:#f5f3ed;--paper:#fffefa;--ink:#182c35;--sub:#657078;--line:#deded5;--accent:#a64a30;--blue:#305e71}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 system-ui,'Malgun Gothic',sans-serif}body.dark{--bg:#142027;--paper:#1d2a33;--ink:#e9edeb;--sub:#a8b7bc;--line:#374751;--accent:#f2a285;--blue:#86b7cb}button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:7px 12px}button:hover,button.active{background:var(--ink);color:var(--paper)}a{color:var(--blue)}.wrap{max-width:1160px;margin:auto;padding:0 24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:10px 0;color:var(--sub);font-size:12px}.mast{text-align:center;padding:24px 0}.mast h1{font:700 clamp(43px,8vw,74px)/1 Georgia,'Batang',serif;letter-spacing:.12em;margin:10px}.mast p{font-size:13px;letter-spacing:.12em;margin:0;color:var(--sub)}nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:5px;overflow:auto;border-top:3px solid var(--ink);border-bottom:1px solid var(--line);padding:9px 0}nav button{white-space:nowrap;border:0;background:none;font-weight:700;padding:8px 15px}.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:18px 0}.tools input,.tools select{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:8px 12px}.tools input{flex:1;min-width:140px}.label{font-size:12px;letter-spacing:.08em;font-weight:800;color:var(--accent)}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:22px}.lead,.story,.side{background:var(--paper);border:1px solid var(--line);padding:23px;border-radius:5px}.lead{border-top:4px solid var(--accent)}h2,h3{line-height:1.35;margin:10px 0;word-break:keep-all}h2{font-size:clamp(24px,4vw,36px)}h3{font-size:22px}.sub{color:var(--sub);font-size:13px}.lead .summary{font-size:17px}.story{margin:14px 0}.article-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.bookmark{font-size:19px;line-height:1;min-width:38px}.status{display:inline-block;color:var(--sub);border:1px solid var(--line);border-radius:4px;font-size:11px;padding:3px 7px}.details{border-top:1px solid var(--line);margin-top:15px;padding-top:12px}.details h4{font-size:13px;margin:15px 0 3px;color:var(--blue)}.details p{margin:0 0 10px}.chart{margin:18px 0;background:var(--bg);border:1px solid var(--line);padding:14px;border-radius:5px}.barrow{display:grid;grid-template-columns:90px 1fr 60px;align-items:center;gap:10px;margin:10px 0;font-size:13px}.track{height:14px;background:var(--line);border-radius:2px}.bar{height:100%;background:var(--blue);border-radius:2px}.source{font-size:12px;display:flex;gap:12px;flex-wrap:wrap}.side{align-self:start;position:sticky;top:62px}.side h3{font-size:17px;border-bottom:2px solid var(--ink);padding-bottom:12px}.side button{width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);padding:11px 0;border-radius:0}.empty{padding:35px;background:var(--paper);border:1px solid var(--line);text-align:center}.footer{border-top:1px solid var(--line);padding:22px 0;margin-top:24px;font-size:12px;color:var(--sub)}.section-title{font-size:18px;font-weight:800;margin:16px 0 4px}@media(max-width:760px){.wrap{padding:0 14px}.layout{grid-template-columns:1fr}.side{position:static;order:-1}.side #brief{display:none}.lead,.story,.side{padding:17px}.mast{padding:18px 0}.barrow{grid-template-columns:78px 1fr 48px}}
.summary,.details p{white-space:pre-line;line-height:1.85}.summary{margin:16px 0}.details h4{margin-top:19px}</style></head><body><div class="wrap"><header><div class="top"><span id="today"></span><button id="theme">◐ 화면 모드</button></div><div class="mast"><p>DAILY NEWS · INDEPENDENT BRIEFING</p><h1>時事日報</h1><p>시사일보 | 세상의 흐름을 읽는 매일의 기록</p></div></header><nav id="nav" aria-label="뉴스 분야"></nav><div class="tools"><select id="date" aria-label="신문 날짜"></select><input id="search" aria-label="기사 검색" placeholder="기사 제목·내용 검색"><button id="saved">☆ 저장한 기사</button></div><div class="layout"><main><div id="heading" class="section-title"></div><div id="articles"></div></main><aside class="side"><div class="label">DAILY DIGEST</div><h3>오늘의 브리핑</h3><p id="digest" class="sub"></p><div id="brief"></div><p class="sub">확인된 사실과 전망을 구분합니다. 새로운 소식이 없는 분야는 억지로 채우지 않습니다.</p></aside></div><footer class="footer">시사일보 · AI 작성 뉴스 요약 및 분석 · 원문 출처 명시<br>저장한 기사는 이 기기에만 보관됩니다.</footer></div><script src="news.js"></script><script>
const cats=['홈','경제','한반도','전쟁','미국','교육','AI'],issues=(window.ISSUES||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));let cat='홈',savedOnly=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}let saved=new Set(read('sisa-saved',[]));if(read('sisa-dark',false))document.body.classList.add('dark');$('theme').onclick=()=>{document.body.classList.toggle('dark');write('sisa-dark',document.body.classList.contains('dark'))};$('today').textContent=new Intl.DateTimeFormat('ko-KR',{dateStyle:'full',timeZone:'Asia/Seoul'}).format(new Date());$('date').innerHTML=issues.map(i=>'<option>'+esc(i.date)+'</option>').join('');$('nav').innerHTML=cats.map(c=>'<button data-cat="'+c+'">'+c+'</button>').join('');$('nav').onclick=e=>{if(e.target.dataset.cat){cat=e.target.dataset.cat;savedOnly=false;render()}};$('saved').onclick=()=>{savedOnly=!savedOnly;render()};$('date').onchange=render;$('search').oninput=render;const key=(d,a)=>d+'-'+a.id;function chart(c){if(!c||!c.values?.length)return '';let max=Math.max(...c.values.map(x=>Math.abs(x[1])),1);return '<div class="chart"><b>'+esc(c.title)+'</b>'+c.values.map(([n,v])=>'<div class="barrow"><span>'+esc(n)+'</span><div class="track"><div class="bar" style="width:'+Math.abs(Number(v))/max*100+'%"></div></div><strong>'+esc(v)+esc(c.unit)+'</strong></div>').join('')+'<div class="sub">'+esc(c.source)+'</div></div>'}function story(a,d,i){let id=key(d,a),h=i===0?'h2':'h3';return '<article id="'+esc(id)+'" class="'+(i===0?'lead':'story')+'"><div class="article-head"><span class="label">'+esc(a.category)+' · '+esc(a.event)+'</span><button class="bookmark" data-save="'+esc(id)+'" aria-label="기사 저장" aria-pressed="'+saved.has(id)+'">'+(saved.has(id)?'★':'☆')+'</button></div><'+h+'>'+esc(a.title)+'</'+h+'><p class="sub">'+esc(a.subtitle)+'</p><span class="status">'+esc(a.status)+'</span><p class="summary">'+esc(a.summary)+'</p>'+chart(a.chart)+'<div class="details"><h4>사건의 배경</h4><p>'+esc(a.background)+'</p><h4>왜 중요한가</h4><p>'+esc(a.impact)+'</p><h4>앞으로 확인할 점</h4><p>'+esc(a.watch)+'</p></div><div class="source">'+(a.sources||[]).filter(x=>/^https:\/\//.test(x[1])).map(x=>'<a href="'+esc(x[1])+'" target="_blank" rel="noopener noreferrer">'+esc(x[0])+' 원문 ↗</a>').join('')+'</div></article>'}function render(){const issue=issues.find(x=>x.date===$('date').value)||issues[0];document.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat&&!savedOnly));$('saved').classList.toggle('active',savedOnly);let q=$('search').value.toLowerCase().trim();let items=(savedOnly?issues.flatMap(x=>x.articles.map(a=>({a,d:x.date}))).filter(x=>saved.has(key(x.d,x.a))):(issue?.articles||[]).map(a=>({a,d:issue.date})).filter(x=>cat==='홈'||x.a.category===cat||x.a.tags?.includes(cat))).filter(x=>JSON.stringify(x.a).toLowerCase().includes(q));$('heading').textContent=(savedOnly?'저장한 기사':(cat==='홈'?'주요 뉴스':cat))+' · '+items.length+'건';$('digest').textContent=issue?issue.date+' · '+issue.updated+' / '+issue.articles.length+'건':'아직 발행된 신문이 없습니다';$('articles').innerHTML=items.length?items.map((x,i)=>story(x.a,x.d,i)).join(''):'<div class="empty">해당 조건의 확인된 기사가 없습니다.</div>';$('brief').innerHTML=(issue?.articles||[]).map(a=>'<button data-jump="'+esc(key(issue.date,a))+'"><span class="label">'+esc(a.category)+'</span><br>'+esc(a.title)+'</button>').join('')}$('articles').onclick=e=>{let id=e.target.dataset.save;if(id){saved.has(id)?saved.delete(id):saved.add(id);write('sisa-saved',[...saved]);render()}};$('brief').onclick=e=>{let b=e.target.closest('[data-jump]');if(b){cat='홈';savedOnly=false;$('search').value='';render();$(b.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'center'})}};render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
